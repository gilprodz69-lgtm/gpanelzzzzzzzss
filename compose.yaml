services:
  database:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: vpsmanager
      MARIADB_USER: vpsmanager
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
  panel:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_DSN: mysql:host=database;dbname=vpsmanager;charset=utf8mb4
      DB_USER: vpsmanager
    volumes: [storage:/var/www/panel/storage]
    depends_on:
      database: {condition: service_healthy}
    networks: [internal]
  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_DSN: mysql:host=database;dbname=vpsmanager;charset=utf8mb4
      DB_USER: vpsmanager
    command: [php, scripts/console.php, worker]
    volumes: [storage:/var/www/panel/storage]
    depends_on:
      database: {condition: service_healthy}
    networks: [internal]
  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - ./public:/var/www/panel/public:ro
      - ./deploy/nginx-container.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [panel]
    networks: [internal]
volumes:
  database:
  storage:
networks:
  internal:
