server {
    listen 80;
    server_name _;
    root /var/www/panel/public;
    index index.php;
    client_max_body_size 2m;
    location = /api/v1/files/upload-chunk {
        client_max_body_size 8m;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/panel/public/index.php;
        fastcgi_pass panel:9000;
        fastcgi_read_timeout 190s;
    }
    location / { try_files $uri /index.php?$query_string; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/panel/public/index.php;
        fastcgi_pass panel:9000;
        fastcgi_read_timeout 190s;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
    location = /router.php { return 404; }
}
